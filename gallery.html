## gallery.html (versão clean)

```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery — Getulio</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #ffffff;
      font-family: "Times New Roman", serif;
      color: #000;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* HEADER CLEAN */
    .header {
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid #ececec;
    }

    .logo {
      height: 58px;
      width: auto;
      object-fit: contain;
    }

    /* CARROSSEL */
    .carousel-wrapper {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 32px 20px;
    }

    .carousel {
      position: relative;
      width: min(1120px, 94vw);
    }

    .slide {
      display: none;
      width: 100%;
      border-radius: 28px;
      overflow: hidden;
    }

    .slide.active {
      display: block;
    }

    .slide img {
      width: 100%;
      height: 78vh;
      object-fit: cover;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* BOTÕES DISCRETOS */
    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(6px);
      cursor: pointer;
      font-size: 18px;
      transition: opacity 0.2s ease, transform 0.2s ease;
      opacity: 0;
    }

    .carousel:hover .nav-btn {
      opacity: 1;
    }

    .nav-btn:hover {
      transform: translateY(-50%) scale(1.05);
    }

    .prev {
      left: 14px;
    }

    .next {
      right: 14px;
    }

    /* INDICADORES */
    .dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 18px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #d0d0d0;
      transition: background 0.25s ease;
    }

    .dot.active {
      background: #111;
    }

    @media (max-width: 768px) {
      .slide img {
        height: 62vh;
      }

      .nav-btn {
        opacity: 1;
        width: 40px;
        height: 40px;
      }
    }
  </style>
</head>
<body>

  <header class="header">
    <a href="index.html">
      <img src="logo.png" alt="Logo" class="logo" />
    </a>
  </header>

  <main class="carousel-wrapper">
    <div class="carousel">

      <div class="slide active">
        <img src="images/foto1.jpg" alt="Foto 1" />
      </div>

      <div class="slide">
        <img src="images/foto2.jpg" alt="Foto 2" />
      </div>

      <div class="slide">
        <img src="images/foto3.jpg" alt="Foto 3" />
      </div>

      <div class="slide">
        <img src="images/foto4.jpg" alt="Foto 4" />
      </div>

      <button class="nav-btn prev">‹</button>
      <button class="nav-btn next">›</button>

      <div class="dots">
        <span class="dot active"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>

    </div>
  </main>

  <script>
    const slides = document.querySelectorAll('.slide');
    const dots = document.querySelectorAll('.dot');

    let current = 0;

    function showSlide(index) {
      slides[current].classList.remove('active');
      dots[current].classList.remove('active');

      current = (index + slides.length) % slides.length;

      slides[current].classList.add('active');
      dots[current].classList.add('active');
    }

    document.querySelector('.next').addEventListener('click', () => {
      showSlide(current + 1);
    });

    document.querySelector('.prev').addEventListener('click', () => {
      showSlide(current - 1);
    });

    // troca automática a cada 3 segundos
    setInterval(() => {
      showSlide(current + 1);
    }, 3000);
  </script>

</body>
</html>
```
