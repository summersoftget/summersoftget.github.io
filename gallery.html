<style>
    * { box-sizing: border-box; }

    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background-color: #ffffff;
        font-family: "Times New Roman", serif;
        color: #000000;
    }

    body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
    }

    /* ----- TOP BAR (estilo NewJeans: baixar + sns) ----- */
    .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 20px;
    }

    .icon-btn {
        background: none;
        border: none;
        cursor: pointer;
        padding: 4px;
        display: flex;
        align-items: center;
    }

    .icon-btn img {
        width: 20px;
        height: 20px;
        object-fit: contain;
    }

    .top-bar-right {
        display: flex;
        align-items: center;
        gap: 16px;
    }

    .cookie-link {
        font-size: 12px;
        text-decoration: none;
        color: #000000;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .sns-row {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .sns-row img {
        width: 18px;
        height: 18px;
        object-fit: contain;
    }

    /* ----- HEADER COM MENU HAMBURGUER ----- */
    .header {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 6px 20px 18px 20px;
        position: relative;
    }

    .nav-area {
        position: absolute;
        left: 20px;
    }

    .btn {
        background: none;
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        padding: 0;
    }

    .btn .txt {
        font-size: 14px;
        margin-right: 5px;
        text-transform: uppercase;
        color: #000000;
    }

    .btn .ico svg {
        display: block;
    }

    .logo-area a {
        display: block;
    }

    .logo-area img {
        height: 32px;
        width: auto;
        object-fit: contain;
    }

    /* ----- MENU LATERAL ----- */
    .slide-menu-wrap {
        position: fixed;
        top: 0;
        left: -100%;
        width: 100%;
        max-width: 575px;
        height: 100vh;
        background-color: #ffffff;
        box-shadow: 2px 0 10px rgba(0,0,0,0.1);
        z-index: 9999;
        transition: left 0.3s ease;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    .slide-menu-wrap.active { left: 0; }

    .slide-body {
        padding: 80px 40px 20px 40px;
        position: relative;
        text-align: left;
    }

    .btn-slide-close {
        position: absolute;
        top: 25px;
        right: 25px;
    }

    .slide-body ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .slide-body ul li {
        margin-bottom: 24px;
    }

    .slide-body ul li a {
        color: #000000;
        text-decoration: none;
        font-size: 24px;
        text-transform: lowercase;
        display: inline-block;
        transition: opacity 0.2s ease;
    }

    .slide-body ul li a:hover { opacity: 0.6; }

    .slide-body ul li strong {
        font-size: 24px;
        text-transform: lowercase;
        font-weight: bold;
        border-bottom: 2px solid #000000;
        padding-bottom: 2px;
    }

    .sns-wrap {
        display: flex;
        gap: 15px;
        padding: 40px;
        margin-top: auto;
    }

    .sns-wrap img {
        width: 24px;
        height: 24px;
        object-fit: contain;
    }

    /* ----- CARROSSEL PRINCIPAL (estilo NewJeans) ----- */
    .carousel-pane {
        flex: 1;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background-color: #f4f4f4;
        min-height: 60vh;
        position: relative;
    }

    .carousel {
        position: relative;
        width: 100%;
        height: 100%;
    }

    .carousel-slide {
        position: absolute;
        inset: 0;
        opacity: 0;
        transition: opacity 1.1s ease;
    }

    .carousel-slide.active {
        opacity: 1;
    }

    .carousel-slide img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    /* ----- LOGO SOBRE O CARROSSEL ----- */
    .logo-pane {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 0;
    }

    .logo-pane img {
        height: 40px;
        width: auto;
        object-fit: contain;
    }

    /* ----- FOOTER ----- */
    .footer {
        padding: 20px 16px;
        font-size: 12px;
        color: grey;
        text-align: center;
        line-height: 1.4;
    }

    .footer-bottom {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 18px;
        margin-top: 10px;
    }
</style>
</head>

<!-- JAVASCRIPT -->
<script>
    // Menu lateral
    const openMenuBtn = document.getElementById('open-menu-btn');
    const closeMenuBtn = document.getElementById('close-menu-btn');
    const slideMenu = document.getElementById('slide-menu');

    openMenuBtn.addEventListener('click', () => slideMenu.classList.add('active'));
    closeMenuBtn.addEventListener('click', () => slideMenu.classList.remove('active'));

    // Carrossel com autoplay (fade), estilo NewJeans
    const slides = document.querySelectorAll('.carousel-slide');
    let current = 0;
    const intervalMs = 3000;

    function showSlide(index) {
        slides.forEach((slide, i) => {
            slide.classList.toggle('active', i === index);
        });
    }

    function nextSlide() {
        current = (current + 1) % slides.length;
        showSlide(current);
    }

    setInterval(nextSlide, intervalMs);

    // Botão de download baixa a imagem atualmente ativa
    document.getElementById('download-btn').addEventListener('click', () => {
        const activeImg = slides[current].querySelector('img');
        const link = document.createElement('a');
        link.href = activeImg.src;
        link.download = activeImg.src.split('/').pop();
        link.click();
    });
</script>
