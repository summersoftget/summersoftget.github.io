<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GETULIO - Gallery</title>

<link rel="icon" type="image/png" href="favicon.png">

<style>

html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: "Times New Roman", serif;

    /* Imagem para as telas de PC */
    background-image: url("images/moldura-pc.jpg"); 
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
}


/* página branca central */

.page {

    width: calc(100% - 40px); 
    
    min-height: calc(100vh - 40px); 
    
    margin: 20px auto;

    background: rgba(255,255,255,1);

    border: 3px solid black;

    box-shadow:
        0 0 35px rgba(0,0,0,0.45);

    padding: 40px;

    box-sizing: border-box;

}


@media(max-width:600px){

    /* ADICIONE ESTE BLOCO AQUI */
    html, body {
        /* Imagem que será carregada apenas no celular */
        background-image: url("images/moldura-mobile.jpg");
    }

    .page {
        width: 94%;
        min-height: calc(100vh - 20px);
        margin: 10px auto;
        padding: 20px;
        border-width: 2px;
    }
}


/* topo */

header {
    text-align: center;
    padding: 30px 20px;
}

header h1 {
    font-size: clamp(28px, 5vw, 45px);
    font-style: italic;
}

.nav-links a {
    color: black;
    text-decoration: none;
    font-size: 18px;
    margin: 5px;
}

.nav-links a:hover {
    text-decoration: underline;
}


/* GALERIA */

.gallery {

    width: 90%;
    max-width: 1200px;

    margin: 40px auto;

    display: grid;

    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));

    gap: 20px;
}


.gallery img {

    width: 100%;
    height: 260px;

    object-fit: cover;

    cursor: pointer;

    border-radius: 4px;

    transition: transform .35s ease,
                filter .35s ease;

    /* evitar azul */
    outline: none; /* Remove a borda azul no PC */
    -webkit-tap-highlight-color: transparent; /* Remove o piscar azul no celular */
    user-select: none; /* Evita que a imagem seja "selecionada" acidentalmente */

}


.gallery img:hover {

    transform: scale(1.04);

    filter: brightness(0.9);

}



/* LIGHTBOX */

#lightbox {

    display: none;

    position: fixed;

    inset: 0;

    background: rgba(0,0,0,.85);

    z-index: 100;

    justify-content: center;

    align-items: center;

    padding: 20px;

}


#lightbox img {

    max-width: 95%;

    max-height: 90vh;

    object-fit: contain;

}



#close {

    position: absolute;

    top: 20px;

    right: 35px;

    color:white;

    font-size:45px;

    cursor:pointer;

    /*evitar azul*/
    -webkit-tap-highlight-color: transparent;

}



/* MOBILE */

@media(max-width:600px){

    .gallery {

        width: 94%;

        grid-template-columns: repeat(2, 1fr);

        gap: 12px;

    }


    .gallery img {

        height: 170px;

    }


    header {

        padding:20px 10px;

    }

}


</style>

</head>


<body>

<div class="page">

<header>

<h1>gallery</h1>


<div class="nav-links">

<a href="index.html">home</a> //

<a href="art.html">art</a> //

<a href="texts.html">texts</a> //

<a href="projects.html">projects</a>

</div>


</header>



<div class="gallery">


<img src="images/foto1.png" alt="">
<img src="images/foto2.png" alt="">
<img src="images/foto3.png" alt="">
<img src="images/foto4.png" alt="">
<img src="images/foto5.png" alt="">
<img src="photos/foto6.jpg" alt="">
<img src="photos/foto7.jpg" alt="">
<img src="photos/foto8.jpg" alt="">


</div>



<div id="lightbox">

<span id="close">&times;</span>

<img id="lightbox-img">

</div>

</div>




<script>


const images = document.querySelectorAll(".gallery img");

const lightbox = document.getElementById("lightbox");

const lightboxImg = document.getElementById("lightbox-img");

const close = document.getElementById("close");



images.forEach(img => {


    img.addEventListener("click",()=>{


        lightbox.style.display="flex";

        lightboxImg.src = img.src;


    });


});



close.onclick = ()=>{

    lightbox.style.display="none";

};



lightbox.onclick = (e)=>{


    if(e.target === lightbox){

        lightbox.style.display="none";

    }


};



</script>


</body>
</html>
