## gallery.html

```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Getulio — Gallery</title>
    <link rel="icon" href="images/u_favicon.png" type="image/png">

    <!-- Swiper CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ff8800;
            font-family: "Times New Roman", serif;
        }

        /* ===== HEADER (igual ao seu site) ===== */
        .header {
            width: 100%;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            box-sizing: border-box;
            background: white;
            position: relative;
            border-bottom: 1px solid #ddd;
        }

        .logo-area {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        .logo-area img {
            height: 60px;
        }

        .btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-family: "Times New Roman", serif;
        }

        /* ===== CARROSSEL ===== */
        .gallery-section {
            width: 100%;
            padding: 40px 0;
            display: flex;
            justify-content: center;
        }

        .swiper {
            width: 90%;
            max-width: 1100px;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        .swiper-slide {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .swiper-slide img {
            width: 100%;
            height: 650px;
            object-fit: cover;
            display: block;
        }

        /* Bolinhas */
        .swiper-pagination-bullet {
            background: white;
            opacity: 0.7;
        }

        .swiper-pagination-bullet-active {
            opacity: 1;
        }

        /* Setas */
        .swiper-button-next,
        .swiper-button-prev {
            color: white;
        }

        @media (max-width: 768px) {
            .swiper-slide img {
                height: 420px;
            }
        }
    </style>
</head>
<body>

    <header class="header">
        <button class="btn" onclick="history.back()">← voltar</button>

        <div class="logo-area">
            <a href="index.html">
                <img src="logo.png" alt="Logo">
            </a>
        </div>
    </header>

    <section class="gallery-section">
        <div class="swiper mySwiper">
            <div class="swiper-wrapper">

                <div class="swiper-slide">
                    <img src="images/foto1.jpg" alt="Foto 1">
                </div>

                <div class="swiper-slide">
                    <img src="images/foto2.jpg" alt="Foto 2">
                </div>

                <div class="swiper-slide">
                    <img src="images/foto3.jpg" alt="Foto 3">
                </div>

                <div class="swiper-slide">
                    <img src="images/foto4.jpg" alt="Foto 4">
                </div>

            </div>

            <!-- Setas -->
            <div class="swiper-button-next"></div>
            <div class="swiper-button-prev"></div>

            <!-- Bolinhas -->
            <div class="swiper-pagination"></div>
        </div>
    </section>

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script>
        const swiper = new Swiper(".mySwiper", {
            loop: true,

            autoplay: {
                delay: 3000,
                disableOnInteraction: false,
            },

            speed: 800,

            pagination: {
                el: ".swiper-pagination",
                clickable: true,
            },

            navigation: {
                nextEl: ".swiper-button-next",
                prevEl: ".swiper-button-prev",
            },
        });
    </script>

</body>
</html>
```
