<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GETULIO - writing</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>

    :root{
        --ink:#000000;
        --paper:#ffffff;
        --sans:"Space Grotesk", "Helvetica Neue", Arial, sans-serif;
    }

    *{ box-sizing:border-box; }

    html, body{
        margin:0;
        padding:0;
        width:100%;
        height:100%;
        overflow:hidden;
        background:var(--ink);
    }

    .home-link{
        position:fixed;
        top:20px;
        left:20px;
        z-index:5;
        font-family:var(--sans);
        font-size:14px;
        color:var(--paper);
        background:rgba(0,0,0,0.35);
        text-decoration:none;
        padding:6px 12px;
    }
    .home-link:hover{ text-decoration:underline; }

    .split{
        display:flex;
        width:100%;
        height:100vh;
    }

    .half{
        position:relative;
        flex:1;
        overflow:hidden;
        display:block;
        text-decoration:none;
        border:none;
        background-color: var(--ink);
    }

    /* thin divider between the two halves */
    .half.left{ border-right:1px solid var(--ink); }

    /* Base styles for both photo layers */
    .half .photo{
        position:absolute;
        top:-4%;
        left:-4%;
        width:108%;
        height:108%;
        background-size:cover;
        background-position:center;
        transform:scale(1);
        filter:grayscale(15%);
        transition: transform 0.45s ease, opacity 0.45s ease; 
    }

    /* Imagem principal visível por padrão */
    .half .photo.main {
        opacity: 1;
        z-index: 1;
    }

    /* Imagem secundária (hover) invisível por padrão */
    .half .photo.alt {
        opacity: 0;
        z-index: 0;
    }

    /* No hover: a imagem principal desaparece */
    .half:hover .photo.main, .half.active .photo.main {
        opacity: 0;
        transform:scale(1.06); 
    }

    /* No hover: a imagem secundária aparece */
    .half:hover .photo.alt, .half.active .photo.alt {
        opacity: 1;
        transform:scale(1.06); 
    }

    .half .veil{
        position:absolute;
        inset:0;
        background:linear-gradient(to top, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0) 42%);
        pointer-events:none;
        transition: opacity 0.45s ease; 
        opacity: 1;
        z-index: 2;
    }
    
    /* O véu desaparece no hover para revelar a segunda imagem limpa */
    .half:hover .veil, .half.active .veil{
        opacity: 0;
    }

    .half .content {
        position:absolute;
        bottom:32px;
        z-index:3;
        display:flex;
        flex-direction:column;
    }

    /* PC: Blog no canto esquerdo */
    .half.left .content {
        left:32px;
        align-items:flex-start;
        text-align:left;
    }

    /* PC: Essays no canto direito */
    .half.right .content {
        right:32px;
        align-items:flex-end;
        text-align:right;
    }

    .half .label{
        font-family: "Futura PT Medium", "Futura PT", Futura, sans-serif;
        font-weight:500;
        font-size:75pt;
        color:var(--paper);
        letter-spacing:0.2px;
        line-height:1;
        margin:0;
    }

    .half .sub{
        font-family:var(--sans);
        font-weight:500;
        font-size:13px;
        color:rgba(255,255,255,0.75);
        margin-top:8px;
    }

    @media (max-width:700px){
        html, body{ overflow:hidden; } /* Prevents unwanted scrolling on mobile */
        
        .split{
            flex-direction:column;
            height: 100dvh; /* Uses dynamic viewport height for mobile browsers */
        }
        
        .half{ 
            flex: none; /* Prevents the blocks from collapsing to 0 height */
            height: 50%;
            width: 100%;
        }
        
        .half.left{ border-right:none; border-bottom:1px solid var(--ink); }

        /* Smartphone: Força o texto da direita para a esquerda */
        .half.right .content {
            left:32px;
            right:auto;
            align-items:flex-start;
            text-align:left;
        }

        /* Smartphone: Diminui a fonte para caber melhor na tela menor */
        .half .label{
            font-size:40pt;
        }
    }

</style>
</head>
<body>

    <a class="home-link" href="https://summersoftget.github.io/index.html">home</a>

    <div class="split">

        <a class="half left" href="https://summersoftget.github.io/blog.html">
            <!-- Imagem secundária (hover) -->
            <div class="photo alt" style="background-image:url('backgroundblog2.png');"></div>
            <!-- Imagem principal -->
            <div class="photo main" style="background-image:url('backgroundblog.png');"></div>
            <div class="veil"></div>
            <div class="content">
                <span class="label">blog</span>
                <span class="sub">pensamentos, mais soltos</span>
            </div>
        </a>

        <a class="half right" href="https://summersoftget.github.io/essays.html">
            <!-- Imagem secundária (hover) -->
            <div class="photo alt" style="background-image:url('backgroundessays2.png');"></div>
            <!-- Imagem principal -->
            <div class="photo main" style="background-image:url('backgroundessays.png');"></div>
            <div class="veil"></div>
            <div class="content">
                <span class="label">essays</span>
                <span class="sub">textos mais longos</span>
            </div>
        </a>

    </div>

</body>
</html>
