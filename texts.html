<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GETULIO - writing</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>

    :root{
        --ink:#000000;
        --paper:#ffffff;
        --sans:"Space Grotesk", "Helvetica Neue", Arial, sans-serif;
    }

    *{ box-sizing:border-box; }

    html, body{
        margin:0;
        padding:0;
        width:100%;
        height:100%;
        overflow:hidden;
        background:var(--ink);
    }

    .home-link{
        position:fixed;
        top:20px;
        left:20px;
        z-index:5;
        font-family:var(--sans);
        font-size:14px;
        color:var(--paper);
        background:rgba(0,0,0,0.35);
        text-decoration:none;
        padding:6px 12px;
    }
    .home-link:hover{ text-decoration:underline; }

    .split{
        display:flex;
        width:100%;
        height:100vh;
    }

    .half{
        position:relative;
        flex:1;
        overflow:hidden;
        display:block;
        text-decoration:none;
        border:none;
        /* Adicionando transição para a cor de fundo */
        transition: background-color 0.45s ease; 
    }

    /* thin divider between the two halves */
    .half.left{ border-right:1px solid var(--ink); }

    .half .photo{
        position:absolute;
        top:-4%;
        left:-4%;
        width:108%;
        height:108%;
        background-size:cover;
        background-position:center;
        transition:transform 0.45s ease;
        transform:scale(1);
        filter:grayscale(15%);
        /* Adicionando transição para a opacidade */
        transition: opacity 0.45s ease; 
    }

    /* No hover: a imagem aparece */
    .half:hover .photo, .half.active .photo{
        opacity: 1;
        transform:scale(1.06); /* Mantendo a animação de zoom */
    }

    /* Estado inicial: a imagem está oculta (transparente) */
    .half .photo{
        opacity: 0;
    }

    /* No hover: o fundo fica preto (apenas para garantir, já que o corpo já é preto) */
    .half:hover, .half.active{
        background-color: var(--ink); 
    }

    .half .veil{
        position:absolute;
        inset:0;
        background:linear-gradient(to top, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0) 42%);
        pointer-events:none;
        /* Adicionando transição para a opacidade */
        transition: opacity 0.45s ease; 
    }
    
    /* O véu também aparece no hover */
    .half:hover .veil, .half.active .veil{
        opacity: 1;
    }
    
    /* Estado inicial do véu: oculto */
    .half .veil{
        opacity: 0;
    }

    .half .label{
        position:absolute;
        left:32px;
        bottom:32px;
        z-index:2;
        font-family:var(--sans);
        font-weight:600;
        font-size:clamp(28px, 5vw, 48px);
        color:var(--paper);
        letter-spacing:0.2px;
    }

    .half .sub{
        position:absolute;
        left:32px;
        bottom:32px;
        transform:translateY(28px);
        z-index:2;
        font-family:var(--sans);
        font-weight:500;
        font-size:13px;
        color:rgba(255,255,255,0.75);
    }

    @media (max-width:700px){
        html, body{ overflow:auto; }
        .split{
            flex-direction:column;
            height:auto;
        }
        .half{ height:50vh; }
        .half.left{ border-right:none; border-bottom:1px solid var(--ink); }
    }

</style>
</head>
<body>

    <a class="home-link" href="https://summersoftget.github.io/index.html">home</a>

    <div class="split">

        <!-- Troque a imagem de fundo em lebowski.png pela foto que representa o blog -->
        <a class="half left" href="https://summersoftget.github.io/texts.html">
            <div class="photo" style="background-image:url('lebowski.png');"></div>
            <div class="veil"></div>
            <span class="label">texts</span>
            <span class="sub">pensamentos, mais soltos</span>
        </a>

        <!-- Troque a imagem de fundo em essaysphoto.jpg pela foto que representa os ensaios -->
        <a class="half right" href="https://summersoftget.github.io/essays.html">
            <div class="photo" style="background-image:url('essaysphoto.jpg');"></div>
            <div class="veil"></div>
            <span class="label">essays</span>
            <span class="sub">textos mais longos</span>
        </a>

    </div>

</body>
</html>
