        .sns-wrap img {

        #contact {

            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        #main,

            position: relative;

        /* Configuração para Monitores (PC) */
        #background video {

        }

        #background video:nth-of-type(2) {

            right: 2vw;
            transform: rotate(18deg) scale(1.2);
        }

        #background video:nth-of-type(3) {
            bottom: 6vh;
            left: 12vw;
            transform: rotate(-6deg) scale(1);
        }

        #background video:nth-of-type(4) {
            top: 10vh;
            right: 8vw;
            transform: rotate(-24deg) scale(1.05);
        }

        .cloud {
            position: absolute;
            height: auto;
            pointer-events: none;
            will-change: transform;
            opacity: 1; 
            z-index: 1; /* Fica atrás dos vídeos */
        }

        /* Ajustes exclusivos para Celular */

            }

<script>
// --- VÍDEOS: Início aleatório ---
const videos = document.querySelectorAll("#background video");
videos.forEach(video => {
    video.addEventListener("loadedmetadata", () => {
        video.currentTime = Math.random() * video.duration;
    });
});

// --- NUVENS ALEATÓRIAS E MAIORES NO PC ---
const bgContainer = document.getElementById("background");
const cloudImages = ["nuvem1.png", "nuvem2.png"]; 
const NUM_CLOUDS = 8; 

function resetCloud(img, initial = false) {
    img.src = cloudImages[Math.floor(Math.random() * cloudImages.length)];
    
    // Posição vertical espalhada (2% a 78%)
    const topPos = Math.random() * 78 + 2;
    img.style.top = topPos + "%";

    // Tamanho adaptável: varia de 100px até 400px no PC
    const minVW = Math.floor(Math.random() * 15) + 10;
    const minPx = Math.floor(Math.random() * 60) + 100;
    const maxPx = Math.floor(Math.random() * 180) + 220;
    img.style.width = `clamp(${minPx}px, ${minVW}vw, ${maxPx}px)`;

    const approxWidth = maxPx;

    // Velocidades variadas (30s a 130s)
    const duration = Math.random() * 100 + 30;

    // Espaçamento horizontal
    const randomOffset = Math.random() * 350 + 50; 
    const startX = initial 
        ? (Math.random() * (window.innerWidth + approxWidth)) - approxWidth 
        : -approxWidth - randomOffset;

    const endX = window.innerWidth + 100;

    if (img.currentAnimation) {
        img.currentAnimation.cancel();
    }

    const anim = img.animate(
        [
            { transform: `translateX(${startX}px)` },
            { transform: `translateX(${endX}px)` }
        ],
        {
            duration: duration * 1000,
            iterations: 1,
            easing: "linear"
        }
    );

    img.currentAnimation = anim;

    anim.onfinish = () => resetCloud(img, false);
}

for (let i = 0; i < NUM_CLOUDS; i++) {
    const cloud = document.createElement("img");
    cloud.classList.add("cloud");
    // Inserimos a nuvem antes dos vídeos para reforçar a hierarquia visual
    bgContainer.prepend(cloud);
    resetCloud(cloud, true);
}
</script>
