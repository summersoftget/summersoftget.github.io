<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GETULIO</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: "Times New Roman", serif;

            background-image: url("sitefundo.png");
            background-size: cover;          
            background-position: center;    
            background-repeat: no-repeat;   
            background-attachment: fixed;   

            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* No celular, "fixed" costuma dar problema (o Safari trava/zoom a imagem),
           então trocamos para "scroll" e garantimos que a imagem continue cobrindo a tela toda. */
        @media (max-width: 600px) {
            html, body {
                background-attachment: scroll;
                background-size: cover;
                background-position: center;
            }
        }

        /* Main area takes up all available space, pushing contact info down naturally */
        #main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .main-title {
            font-size: clamp(22px, 5vw, 42px); 
            font-style: italic;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .responsive-logo {
            width: 100%;
            max-width: 560px;
            height: auto;
            margin-bottom: 25px;
            max-height: 25vh; 
            object-fit: contain;
            filter: drop-shadow(2px 4px 8px rgba(0, 0, 0, 0.35)); 
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), 
                filter 0.4s ease;
        }

        .responsive-logo:hover {
            transform: scale(1.06);
            filter: drop-shadow(2px 8px 14px rgba(0, 0, 0, 0.35));
        }

        .nav-links a {
            color: #000;
            text-decoration: none;
            font-size: 18px;
            display: inline-block;
            margin: 5px;
        }
        .nav-links a:hover {
            text-decoration: underline;
        }

        .sns-wrap {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
        }

        .sns-wrap img {
            width: 24px;
            height: 24px;
            object-fit: contain;
            transition: transform 0.2s ease;
        }

        .sns-wrap img:hover {
            transform: scale(1.1);
        }

       
        #contact {
            position: fixed;
            right: 16px;
            bottom: 12px;
            font-size: 14px;
            color: #666;
            text-align: right;
            line-height: 1.35;
            z-index: 10;
        }

        #contact .address {
            margin-top: 4px;
        }

        #background {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        #main,
        #contact {
            position: relative;
            z-index: 1;
        }

        #background video {
            position: absolute;
            width: clamp(120px, 18vw, 260px);
            height: auto;      
            pointer-events: none;
        }

        #background video:nth-of-type(1) {
            top: 8%;
            left: 6%;
            transform: rotate(-12deg) scale(0.9);
        }

        #background video:nth-of-type(2) {
            top: 50%;
            right: 8%;
            transform: rotate(18deg) scale(1.2);
        }

        #background video:nth-of-type(3) {
            bottom: 8%;
            left: 35%;
            transform: rotate(-6deg) scale(0.75);
        }

        #background video:nth-of-type(4) {
            top: 5%;
            right: 12%;
            transform: rotate(-24deg) scale(0.75);
        }

        /* ---- Nuvens passando no fundo ---- */
        .cloud {
            position: absolute;
            width: clamp(90px, 22vw, 260px);
            height: auto;
            opacity: 0.9;
            pointer-events: none;
            will-change: transform;
            animation-name: cloud-drift;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }

        .cloud--1 {
            top: 10%;
            animation-duration: 100s;
            animation-delay: 0s;
        }

        .cloud--2 {
            top: 22%;
            width: clamp(70px, 16vw, 190px);
            opacity: 0.8;
            animation-duration: 130s;
            animation-delay: -40s; /* já entra "no meio" do trajeto */
        }

        .cloud--3 {
            top: 4%;
            width: clamp(110px, 26vw, 300px);
            animation-duration: 120s;
            animation-delay: -70s;
        }

        .cloud--4 {
            top: 32%;
            width: clamp(60px, 14vw, 160px);
            opacity: 0.7;
            animation-duration: 85s;
            animation-delay: -20s;
        }

        @keyframes cloud-drift {
            from {
                transform: translateX(-40vw);
            }
            to {
                transform: translateX(140vw);
            }
        }

        /* Respeita quem prefere menos movimento na tela */
        @media (prefers-reduced-motion: reduce) {
            .cloud {
                animation: none;
                left: 10%;
            }
        }

        
        @media (max-width: 600px) {
            #contact {
                position: static; 
                text-align: center;
                padding-bottom: 20px; 
                font-size: 13px;
            }
        }
    </style>
</head>
